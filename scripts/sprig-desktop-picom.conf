# picom config for the agent's desktop — the one source of visual depth and
# motion on top of Yaru-dark + BuzzDark. Kept minimal and "smooth, not
# heavy" per direction: soft shadows on real windows, a fade on open/close
# tuned to ~140ms, and a small inactive-window dim so focus reads visually.
# No blur, no rounded corners, no wobble/glx effects — those cost more
# render time than they're worth over VNC, and this is a headless Xvfb
# display with no GPU backend anyway (xrender only, set on the CLI).

backend = "xrender";
vsync = false;

# --- Shadows ----------------------------------------------------------
# Soft, small-radius, low-opacity — a hint of depth, not a drop-shadow
# effect from 2008. Explicitly excluded from the desktop/root window and
# from the openbox root menu: a shadow under the wallpaper itself would
# look like a rendering bug, and a shadow on a transient popup menu reads
# as heavier than a menu should.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [
  "class_g = 'Tint2'",
  "_NET_WM_WINDOW_TYPE@:32a *= 'DESKTOP'",
  "_NET_WM_WINDOW_TYPE@:32a *= 'MENU'",
  "_NET_WM_WINDOW_TYPE@:32a *= 'DROPDOWN_MENU'",
  "_NET_WM_WINDOW_TYPE@:32a *= 'POPUP_MENU'",
  "_NET_WM_WINDOW_TYPE@:32a *= 'TOOLTIP'"
];

# --- Fading -------------------------------------------------------------
# Tuned to land the full fade in ~120-160ms: picom re-paints every
# fade-delta milliseconds, stepping opacity by fade-in/out-step each time,
# so total duration is roughly step-count * fade-delta = (1/0.10) * 14 =
# 140ms. Fast enough to feel instant during rapid window open/close, slow
# enough to actually read as a fade rather than a pop — this is meant as a
# "beautiful, familiar desktop" cue (smooth, not heavy), not a kiosk-mode
# instant-cut.
fading = true;
fade-in-step = 0.10;
fade-out-step = 0.10;
fade-delta = 14;

# --- Opacity --------------------------------------------------------------
# Windows stay fully opaque — no see-through chrome, that's not what
# "modern desktop" means here. inactive-dim gives focus a visual read
# instead: unfocused windows sit very slightly darker, barely perceptible
# individually but unmistakable when two windows overlap side by side.
# Kept tiny (0.06) per spec — enough to read as "this one isn't focused",
# not enough to look like a modal-dimmed background.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.06;
inactive-dim-fixed = true;

# --- Corners / blur -------------------------------------------------------
# Left off. The BuzzDark theme uses square corners; rounding them only in
# the compositor would fight the theme's own border rendering. No blur —
# it's the most expensive picom feature and buys nothing on a desktop
# that's mostly full-bleed windows over a wallpaper.
corner-radius = 0;

# --- Misc -----------------------------------------------------------------
# No window-type-specific animations beyond the global fade; no rounded
# borders; no dim-inactive (a dark theme dimming further reads as broken,
# not as focus).
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = true;
use-damage = true;
