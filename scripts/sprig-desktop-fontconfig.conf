<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  fontconfig for the agent's desktop. Without this, fonts render with
  antialiasing/hinting defaults that vary by what's compiled into whatever
  library resolved them first — the visible symptom was "ugly Linux
  fonts": jagged edges, wrong metrics, inconsistent weight between GTK2
  apps (pcmanfm), GTK3 apps (xfce4-terminal), and openbox's own titlebar
  text. This makes every app that reads fontconfig (which is all of them,
  including openbox) render the same way: antialiased, lightly hinted,
  subpixel RGB — the modern default, not the fontconfig-absent fallback.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Generic family aliases so anything asking for "sans-serif" or
       "monospace" without a specific name lands on the fonts installed
       for this desktop (Inter, JetBrains Mono) rather than whatever
       Debian's default happens to be. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>JetBrains Mono</string></edit>
  </match>
</fontconfig>
