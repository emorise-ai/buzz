name: Secret scan

on:
  push:
    branches: [main, release]
    tags: ["*"]
  # The workflow definition always comes from the trusted default branch.
  # No PR code is executed; the checkout is only inspected as data.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan introduced commits
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          # This takes precedence over config files supplied by a PR while
          # preserving Gitleaks' built-in rules.
          GITLEAKS_CONFIG_TOML: |
            title = "Buzz trusted default configuration"

            [extend]
            useDefault = true
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE_SHA" ]; then
            scan_args=("$PR_BASE_SHA..$PR_HEAD_SHA")
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            scan_args=("$BEFORE_SHA..$CURRENT_SHA")
          elif [ "$REF_TYPE" = "tag" ]; then
            scan_args=("$CURRENT_SHA" --not refs/remotes/origin/main)
            if git show-ref --verify --quiet refs/remotes/origin/release; then
              scan_args+=(refs/remotes/origin/release)
            fi
          elif [ "$REF_NAME" = "release" ]; then
            scan_args=("$CURRENT_SHA" --not refs/remotes/origin/main)
          else
            scan_args=("$CURRENT_SHA^!")
          fi

          expected_commits="$(git rev-list --count "${scan_args[@]}")"
          if [ "$expected_commits" -eq 0 ]; then
            echo "No commits outside the protected branches require scanning."
            exit 0
          fi

          ignore_dir="$RUNNER_TEMP/gitleaks-no-ignore"
          scan_log="$RUNNER_TEMP/gitleaks.log"
          mkdir -p "$ignore_dir"

          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="${scan_args[*]} -m" \
            --gitleaks-ignore-path "$ignore_dir" \
            --ignore-gitleaks-allow \
            --no-banner \
            --no-color \
            --redact 2>&1 | tee "$scan_log"
          scan_status="${PIPESTATUS[0]}"
          set -e

          scanned_commits="$(sed -nE 's/.*INF ([0-9]+) commits scanned\..*/\1/p' "$scan_log" | tail -n 1)"
          if [ -z "$scanned_commits" ] || [ "$scanned_commits" -eq 0 ]; then
            echo "::error::Gitleaks did not confirm that it scanned any commits."
            exit 1
          fi
          if [ "$scan_status" -ne 0 ]; then
            exit "$scan_status"
          fi
